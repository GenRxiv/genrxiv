  <g stroke-linecap="round" fill="none" stroke-width="4.5">
    <line x1="24" y1="30" x2="72" y2="30" stroke="#1B1E27"/>
    <line x1="24" y1="44" x2="62" y2="44" stroke="#1B1E27"/>
    <line x1="24" y1="58" x2="69" y2="58" stroke="#2F5CFF" stroke-dasharray="9 6"/>
    <line x1="24" y1="72" x2="45" y2="72" stroke="#2F5CFF" stroke-dasharray="2.5 6"/>
  </g>
</svg>
