<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96" role="img" aria-label="GenRxiv">
  <title>GenRxiv</title>
  <!-- Enclosed "seal" variant. The frame gives it more institutional weight —
       use where the mark sits on a busy or photographic background. -->
