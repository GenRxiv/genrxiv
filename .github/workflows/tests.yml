name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  conversion-service:
    name: Conversion service API tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc

      - name: Install Tectonic
        run: |
          curl -sSL https://drop-sh.fullyjustified.net | sh
          mkdir -p $HOME/.local/bin
          mv tectonic $HOME/.local/bin/
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Warm Tectonic cache
        run: |
          echo '\documentclass{article}\begin{document}warmup\end{document}' > /tmp/warmup.tex
          tectonic /tmp/warmup.tex

      - name: Install dependencies
        working-directory: convert-service
        run: pip install -r requirements-dev.txt

      - name: Run tests
        working-directory: convert-service
        run: pytest test_app.py -v

  api:
    name: API tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install PostgreSQL
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql postgresql-contrib
          sudo systemctl start postgresql.service

      - name: Create test database
        run: |
          sudo -u postgres psql -c "CREATE USER testuser WITH PASSWORD 'testpass' SUPERUSER;" || true
          sudo -u postgres psql -c "CREATE DATABASE genrxiv_test OWNER testuser;"

      - name: Install dependencies
        working-directory: api
        run: pip install -r requirements-dev.txt

      - name: Run tests
        working-directory: api
        env:
          DATABASE_URL_TEST: "postgresql://testuser:testpass@localhost:5432/genrxiv_test"
        run: pytest test_api.py -v
