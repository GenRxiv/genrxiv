name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  conversion-service:
    name: Conversion service API tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc

      - name: Install Tectonic
        run: |
          curl -sSL https://drop-sh.fullyjustified.net | sh
          mkdir -p $HOME/.local/bin
          mv tectonic $HOME/.local/bin/
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Warm Tectonic cache
        run: |
          echo '\documentclass{article}\begin{document}warmup\end{document}' > /tmp/warmup.tex
          tectonic /tmp/warmup.tex

      - name: Install dependencies
        working-directory: convert-service
        run: pip install -r requirements-dev.txt

      - name: Run tests
        working-directory: convert-service
        run: pytest test_app.py -v
