[tool.pytest.ini_options]
filterwarnings = [
    # Starlette 1.x test client deprecations — library-internal, not our code.
    # The test client uses httpx internally; starlette now prefers httpx2.
    # Our application code uses httpx directly (for ORCID/conversion service),
    # so switching to httpx2 would require code changes for test-only benefit.
    # Remove these filters when starlette's test client stabilizes.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
    "ignore:The anyio.abc.BlockingPortal alias is deprecated",
]
