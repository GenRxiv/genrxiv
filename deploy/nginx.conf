server {
    listen 80;
    server_name _;

    resolver 127.0.0.11 valid=30s;

    # Splash page — static files from /site
    location / {
        root /site;
        try_files $uri $uri/ /index.html;
    }

    # Signup API — proxy to convert-service
    location /api/ {
        set $convert_upstream http://convert:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $convert_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ORCID OAuth redirect — routes to OJS orcid/authorizeOrcid handler
    # The redirect URI registered at ORCID is genrxiv.org/genrxiv/orcidVerify
    location /genrxiv/orcidVerify {
        set $ojs_upstream http://ojs:80;
        rewrite ^/genrxiv/orcidVerify$ /genrxiv/orcid/authorizeOrcid break;
        proxy_pass $ojs_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # OJS — proxy to the OJS container
    location /app/ {
        set $ojs_upstream http://ojs:80;
        rewrite ^/app/(.*)$ /$1 break;
        proxy_pass $ojs_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_set_header Accept-Encoding "";
        sub_filter 'href="/' 'href="/app/';
        sub_filter 'src="/' 'src="/app/';
        sub_filter 'action="/' 'action="/app/';
        sub_filter 'href="http://$host/' 'href="https://$host/app/';
        sub_filter 'src="http://$host/' 'src="https://$host/app/';
        sub_filter 'href="https://$host/' 'href="https://$host/app/';
        sub_filter 'src="https://$host/' 'src="https://$host/app/';
        sub_filter 'action="https://$host/' 'action="https://$host/app/';
        sub_filter_once off;
        sub_filter_types text/html text/css application/javascript;
    }
}
