# This file is loaded at the http level to define the $cache_control variable.
# It returns "no-cache" for error responses so Cloudflare won't cache 404s/500s,
# and passes through the upstream Cache-Control for successful responses.

map $upstream_status $cache_control {
    default         "public, max-age=3600";
    ~^[23]          "public, max-age=3600";
    ~^[45]          "no-cache, no-store, must-revalidate";
}
