services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: genrxiv
      POSTGRES_USER: genrxiv
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - genrxiv_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "psql -U genrxiv -d genrxiv -c 'SELECT 1'"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s

  api:
    build:
      context: ..
      dockerfile: api/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      convert:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://genrxiv:${DB_PASSWORD}@db/genrxiv
      ORCID_CLIENT_ID: ${ORCID_CLIENT_ID}
      ORCID_CLIENT_SECRET: ${ORCID_CLIENT_SECRET}
      SESSION_SECRET: ${SESSION_SECRET}
      ARK_NAAN: ${ARK_NAAN:-99999}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      ADMIN_ORCIDS: ${ADMIN_ORCIDS}
      REVIEWER_ORCIDS: ${REVIEWER_ORCIDS:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      ADMIN_GITHUB_IDS: ${ADMIN_GITHUB_IDS:-}
      REVIEWER_GITHUB_IDS: ${REVIEWER_GITHUB_IDS:-}
      CONVERT_SERVICE_URL: http://convert:8000
      BASE_URL: https://genrxiv.org
      SCREENING_ENABLED: ${SCREENING_ENABLED:-false}
      CF_API_TOKEN: ${CF_API_TOKEN}
      CF_ACCOUNT_ID: ${CF_ACCOUNT_ID}
      SCREENING_MODEL: ${SCREENING_MODEL:-@cf/meta/llama-3.2-3b-instruct}
      UMAMI_WEBSITE_ID: ${UMAMI_WEBSITE_ID:-}
    volumes:
      - article_files:/app/files
    expose:
      - "8000"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1g

  convert:
    build:
      context: ..
      dockerfile: convert-service/Dockerfile
    restart: unless-stopped
    expose:
      - "8000"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - api
      - convert
      - umami
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../site:/site:ro
    ports:
      - "8080:80"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128m

  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://genrxiv:${DB_PASSWORD}@db:5432/genrxiv?schema=umami
      DATABASE_TYPE: postgresql
      APP_SECRET: ${UMAMI_APP_SECRET}
    expose:
      - "3000"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512m

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel run --token ${CF_TUNNEL_TOKEN}
    depends_on:
      - nginx

volumes:
  genrxiv_db:
  article_files:
