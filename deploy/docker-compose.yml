services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: genrxiv
      POSTGRES_USER: genrxiv
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - genrxiv_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "psql -U genrxiv -d genrxiv -c 'SELECT 1'"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s

  api:
    build:
      context: ..
      dockerfile: api/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      convert:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://genrxiv:${DB_PASSWORD}@db/genrxiv
      ORCID_CLIENT_ID: ${ORCID_CLIENT_ID}
      ORCID_CLIENT_SECRET: ${ORCID_CLIENT_SECRET}
      SESSION_SECRET: ${SESSION_SECRET}
      ARK_NAAN: ${ARK_NAAN:-99999}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      ADMIN_ORCIDS: ${ADMIN_ORCIDS}
      CONVERT_SERVICE_URL: http://convert:8000
      BASE_URL: https://genrxiv.org
    volumes:
      - article_files:/app/files
    expose:
      - "8000"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1g

  convert:
    build:
      context: ..
      dockerfile: convert-service/Dockerfile
    restart: unless-stopped
    expose:
      - "8000"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - api
      - convert
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../site:/site:ro
    ports:
      - "8080:80"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128m

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel run --token ${CF_TUNNEL_TOKEN}
    depends_on:
      - nginx

volumes:
  genrxiv_db:
  article_files:
