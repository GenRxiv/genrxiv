services:
  ojs:
    environment:
      PKP_CLI_INSTALL: 1
      PKP_DB_HOST: db
      PKP_DB_NAME: ojs
      PKP_DB_USER: ojs
      PKP_DB_PASSWORD: ${DB_PASSWORD}
      PKP_ADMIN_USER: ${ADMIN_USER}
      PKP_ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      PKP_ADMIN_EMAIL: ${ADMIN_EMAIL}
      PKP_BASE_URL: https://genrxiv.org
      ORCID_CLIENT_ID: ${ORCID_CLIENT_ID}
      ORCID_CLIENT_SECRET: ${ORCID_CLIENT_SECRET}
    volumes:
      - ./deploy/ojs-config-patch.sh:/usr/local/bin/ojs-config-patch.sh:ro
      - ./deploy/ojs-config-patch.php:/usr/local/bin/ojs-config-patch.php:ro
      - ./deploy/ojs-cli-install-patch.sh:/usr/local/bin/pkp-cli-install:ro
      - ./deploy/ojs-entrypoint.sh:/usr/local/bin/ojs-entrypoint.sh:ro
      - ./deploy/ojs-check-tables.php:/usr/local/bin/ojs-check-tables.php:ro
      - ./deploy/ojs-activate-theme.php:/usr/local/bin/ojs-activate-theme.php:ro
      - ./deploy/ojs-create-journal.php:/usr/local/bin/ojs-create-journal.php:ro
      - ./deploy/ojs-configure-orcid.php:/usr/local/bin/ojs-configure-orcid.php:ro
      - ./deploy/ojs-activate-plugins.php:/usr/local/bin/ojs-activate-plugins.php:ro
      - ./deploy/ojs-template-manager-patch.sh:/usr/local/bin/ojs-template-manager-patch.sh:ro
      - ./deploy/ojs-orcid-redirect-patch.sh:/usr/local/bin/ojs-orcid-redirect-patch.sh:ro
      - ./ojs-theme/genrxiv:/var/www/html/plugins/themes/genrxiv:ro
      - ./ojs-plugins/aiDisclosure:/var/www/html/plugins/generic/aiDisclosure:ro
      - ./ojs-plugins/latexCompiler:/var/www/html/plugins/generic/latexCompiler:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/ojs-entrypoint.sh"]
    ports: !reset []

  convert:
    volumes:
      - signups_data:/data

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - ojs
      - convert
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./site:/site:ro
    ports:
      - "8080:80"

  cloudflared:
    command: "tunnel --no-autoupdate --protocol http2 run --token ${CF_TUNNEL_TOKEN}"
    depends_on:
      - nginx

volumes:
  signups_data:
